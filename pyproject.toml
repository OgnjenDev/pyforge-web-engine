[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyforge"
dynamic = ["version"]
description = "A tiny Python-powered web game engine: write game logic in Python, play it in the browser."
readme = "README.md"
requires-python = ">=3.9"
keywords = ["game", "game-engine", "browser", "canvas", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.scripts]
pyforge = "pyforge.cli:main"

[tool.setuptools.dynamic]
version = { attr = "pyforge.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyforge = ["web/*.html", "web/*.js", "py.typed"]
